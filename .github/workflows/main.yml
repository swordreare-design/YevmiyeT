name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npx expo export

      - name: Create Dummy APK for Test
        # Not: Gerçek bir yerel derleme için Android SDK gerekir. 
        # Expo Dashboard kullanmadan doğrudan APK üretmek için bu adım kritik.
        run: |
          mkdir -p build-output
          cp -r dist/* build-output/
          zip -r my-app-package.zip build-output/

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: my-app-bundle
          path: my-app-package.zip
