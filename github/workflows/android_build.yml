name: Generate Android Folder and Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Generate Android Folder (Prebuild)
        # Bu komut eksik olan /android klasörünü GitHub sunucusunda oluşturur
        run: npx expo prebuild --platform android

      - name: Build APK
        # Klasör oluştuktan sonra paketleme yapar
        run: npx expo export --platform android --output-dir dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: real-android-package
          path: |
            android/
            dist/

